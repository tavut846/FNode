name: Build and Release

on:
  workflow_dispatch:
    inputs:
      override_version:
        description: "Optional manual version override (e.g. 0.0.13 or 0.0.13-pre-1)"
        required: false
        type: string
  push:
    branches:
      - master
      - stable
      - dev
      - dev_new
    tags:
      - "*"
  pull_request:
    branches:
      - master
      - stable
      - dev
      - dev_new
  release:
    types: [published]

permissions:
  contents: write

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag_name: ${{ steps.calc.outputs.tag_name }}
      is_prerelease: ${{ steps.calc.outputs.is_prerelease }}
      is_latest: ${{ steps.calc.outputs.is_latest }}
      release_title: ${{ steps.calc.outputs.release_title }}
      commit: ${{ steps.calc.outputs.commit }}
      buildDate: ${{ steps.calc.outputs.buildDate }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate release version and metadata
        id: calc
        shell: bash
        run: |
          OVERRIDE_VER="${{ inputs.override_version }}"
          EVENT_NAME="${{ github.event_name }}"
          REF_NAME="${{ github.ref_name }}"
          REF="${{ github.ref }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "${COMMIT_SHA:0:7}")
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "Event: $EVENT_NAME, Ref: $REF, Ref Name: $REF_NAME"

          # 1. Guarantee all remote tags are retrieved
          git fetch --tags --force 2>/dev/null || true

          # 2. Locate latest stable tag (e.g., 0.0.13)
          LATEST_STABLE_TAG=$(git tag -l --sort=v:refname | grep -E '^[vV]?[0-9]+\.[0-9]+\.[0-9]+$' | tail -n 1 || true)
          if [ -z "$LATEST_STABLE_TAG" ]; then
            LATEST_STABLE_TAG="0.0.1"
          fi
          CLEAN_STABLE="${LATEST_STABLE_TAG#v}"

          # 3. Compute next upgraded patch version (e.g. 0.0.13 -> 0.0.14)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_STABLE"
          NEXT_PATCH=$((PATCH + 1))
          UPGRADED_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"

          # Ensure the upgraded version tag does not collide with any existing tag to prevent replacing existing release files
          while git rev-parse -q --verify "refs/tags/${UPGRADED_VERSION}" >/dev/null || git rev-parse -q --verify "refs/tags/v${UPGRADED_VERSION}" >/dev/null; do
            NEXT_PATCH=$((NEXT_PATCH + 1))
            UPGRADED_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          done

          # 4. Compute commit number since last stable tag
          COMMITS_SINCE=$(git rev-list --count "${LATEST_STABLE_TAG}..HEAD" 2>/dev/null || echo 1)
          if [ -z "$COMMITS_SINCE" ] || [ "$COMMITS_SINCE" -le 0 ]; then
            COMMITS_SINCE=1
          fi

          if [ -n "$OVERRIDE_VER" ]; then
            VERSION="${OVERRIDE_VER#v}"
            TAG_NAME="$VERSION"
            if [[ "$VERSION" =~ -pre- ]] || [[ "$VERSION" =~ - ]]; then
              IS_PRERELEASE="true"
              IS_LATEST="false"
              RELEASE_TITLE="FNode $TAG_NAME (Pre-release)"
            else
              IS_PRERELEASE="false"
              IS_LATEST="true"
              RELEASE_TITLE="FNode $TAG_NAME"
            fi
          elif [ "$EVENT_NAME" = "release" ] || [[ "$REF" == refs/tags/* ]]; then
            VERSION="${REF_NAME#v}"
            TAG_NAME="$VERSION"
            if [[ "$VERSION" =~ -pre- ]] || [[ "$VERSION" =~ - ]]; then
              IS_PRERELEASE="true"
              IS_LATEST="false"
              RELEASE_TITLE="FNode $TAG_NAME (Pre-release)"
            else
              IS_PRERELEASE="false"
              IS_LATEST="true"
              RELEASE_TITLE="FNode $TAG_NAME"
            fi
          elif [[ "$REF_NAME" == "master" || "$REF_NAME" == "main" || "$REF_NAME" == "stable" ]]; then
            # Every new build of a commit increments the version (+1 to patch) and creates a new Latest Release
            VERSION="$UPGRADED_VERSION"
            TAG_NAME="$VERSION"
            IS_PRERELEASE="false"
            IS_LATEST="true"
            RELEASE_TITLE="FNode $TAG_NAME"
          elif [[ "$REF_NAME" == "dev" || "$REF_NAME" == "dev_new" || "$REF_NAME" == dev/* ]]; then
            # Dev branch pre-release
            TAG_NAME="${UPGRADED_VERSION}-pre-${COMMITS_SINCE}"
            VERSION="$TAG_NAME"
            IS_PRERELEASE="true"
            IS_LATEST="false"
            RELEASE_TITLE="FNode $TAG_NAME (Pre-release)"
          else
            # Default / PR / other branches
            TAG_NAME="${UPGRADED_VERSION}-pre-${COMMITS_SINCE}"
            VERSION="$TAG_NAME"
            IS_PRERELEASE="true"
            IS_LATEST="false"
            RELEASE_TITLE="FNode $TAG_NAME (Pre-release)"
          fi

          echo "Calculated metadata:"
          echo "  version: $VERSION"
          echo "  tag_name: $TAG_NAME"
          echo "  is_prerelease: $IS_PRERELEASE"
          echo "  is_latest: $IS_LATEST"
          echo "  release_title: $RELEASE_TITLE"
          echo "  commit: $SHORT_COMMIT"
          echo "  buildDate: $BUILD_DATE"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "is_latest=$IS_LATEST" >> $GITHUB_OUTPUT
          echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT
          echo "commit=$SHORT_COMMIT" >> $GITHUB_OUTPUT
          echo "buildDate=$BUILD_DATE" >> $GITHUB_OUTPUT

  test:
    name: Run Verification Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Run verification test suite
        run: |
          GOEXPERIMENT=jsonv2 go test -v -tags "with_utls" ./...

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}${{ matrix.gomips }})
    needs: [version, test]
    strategy:
      matrix:
        goos: [linux, windows, freebsd, darwin]
        goarch: [amd64, 386]
        exclude:
          - goarch: 386
            goos: darwin
        include:
          # Linux Specifics
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 5
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: mipsle
            gomips: softfloat
          - goos: linux
            goarch: mips
            gomips: softfloat
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: s390x
          # MacOS ARM64
          - goos: darwin
            goarch: arm64
          # Android ARM64
          - goos: android
            goarch: arm64
          # FreeBSD Specials
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: arm
            goarm: 7
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Show workflow information
        id: get_filename
        run: |
          export _NAME=$(jq ".[\"$GOOS-$GOARCH$GOARM$GOMIPS\"].friendlyName" -r < .github/build/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, GOMIPS: $GOMIPS, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Get project dependencies
        run: |
          go mod tidy
          go mod download

      - name: Build FNode
        run: |
          echo "version: ${{ needs.version.outputs.version }}, commit: ${{ needs.version.outputs.commit }}, buildDate: ${{ needs.version.outputs.buildDate }}"
          mkdir -p build_assets
          GOEXPERIMENT=jsonv2 go build -v -o build_assets/FNode -tags "sing with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -ldflags "-X 'github.com/tavut846/FNode/cmd.version=${{ needs.version.outputs.version }}' -X 'github.com/tavut846/FNode/cmd.commit=${{ needs.version.outputs.commit }}' -X 'github.com/tavut846/FNode/cmd.buildDate=${{ needs.version.outputs.buildDate }}' -s -w -buildid="

      - name: Rename Windows FNode
        if: matrix.goos == 'windows'
        run: |
          cd ./build_assets || exit 1
          mv FNode FNode.exe
      - name: Prepare to release
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE
          cp ${GITHUB_WORKSPACE}/example/*.json ./build_assets/
          LIST=('geoip' 'geosite')
          for i in "${LIST[@]}"
          do
            DOWNLOAD_URL="https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/${i}.dat"
            FILE_NAME="${i}.dat"
            echo -e "Downloading ${DOWNLOAD_URL}..."
            curl -L "${DOWNLOAD_URL}" -o ./build_assets/${FILE_NAME}
          done
      - name: Create ZIP archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../FNode-$ASSET_NAME.zip .
          popd || exit 1
          FILE=./FNode-$ASSET_NAME.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done
      - name: Change the name
        run: |
          mv build_assets FNode-$ASSET_NAME
      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FNode-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: |
            ./FNode-${{ steps.get_filename.outputs.ASSET_NAME }}.zip*

  publish:
    name: Publish Release
    needs: [version, build]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: FNode-*
          merge-multiple: true

      - name: Display downloaded files
        run: ls -lh ./artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.release_title }}
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.is_latest == 'true' }}
          files: ./artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
