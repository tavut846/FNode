version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Own PR: a new REALITY release can raise the minimum Go version
      reality:
        patterns:
          - "github.com/xtls/reality"
      dependencies:
        patterns:
          - "*"
    # Direct dependencies plus the REALITY library, which only comes in through
    # the sing-box fork (indirect) and would otherwise never get an update PR.
    allow:
      - dependency-type: "direct"
      - dependency-name: "github.com/xtls/reality"
        dependency-type: "indirect"
    ignore:
      - dependency-name: "github.com/sagernet/sing"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"

